name: RewardLoop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**", "feature/**", "fix/**"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package metadata
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
      - name: Run tests
        run: npm test
      - name: Validate static build
        run: npm run build
